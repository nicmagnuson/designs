<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tiny Planet Crew</title>
<style>
:root{--bg:#0b1026;--panel:#131a3b;--panel2:#1b2352;--line:#2a3470;--text:#eef1ff;--muted:#9aa3d1;--accent:#ffd166;--pink:#ff8fab;--green:#7ee8a2;--red:#ff6b6b;--blue:#8ecae6;--purple:#c8b6ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Nunito","Varela Round","Segoe UI",system-ui,-apple-system,sans-serif;overflow:hidden}
#app{display:grid;grid-template-columns:340px 1fr;height:100vh}
#side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#side header{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
#side h1{margin:0;font-size:20px}#side h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:12px;margin-top:2px}
#addForm{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;gap:6px}
input[type=text],select{background:#0d1230;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px 10px;font:inherit;font-size:13px;outline:none}
input[type=text]{flex:1;min-width:0}
input[type=text]:focus,select:focus{border-color:var(--accent)}
button.primary{background:var(--accent);color:#2a2000;border:0;border-radius:10px;padding:8px 12px;font-weight:800;cursor:pointer;font:inherit;font-size:13px;white-space:nowrap}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:4px 8px;cursor:pointer;font:inherit;font-size:11px;white-space:nowrap}
button.ghost:hover{color:var(--text);border-color:var(--muted)}
button.ghost.warn{border-color:rgba(255,107,107,.5);color:var(--red)}
#scroll{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:10px}
h3{margin:4px 2px 0;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,209,102,.18)}
.card .top{display:flex;align-items:center;gap:8px;cursor:pointer}
.dot{width:14px;height:14px;border-radius:50%;flex:none;border:2px solid rgba(255,255,255,.35)}
.name{font-weight:800;font-size:14px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lvl{font-size:11px;font-weight:800;color:var(--accent);background:rgba(255,209,102,.12);border-radius:999px;padding:2px 8px;white-space:nowrap}
.lvl.max{color:#2a2000;background:var(--accent)}
.bar{height:6px;background:#0d1230;border-radius:999px;margin:8px 0 6px;overflow:hidden}.bar i{display:block;height:100%;border-radius:999px;transition:width .35s}
.meta{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.tasks{margin-top:8px;display:flex;flex-direction:column;gap:3px}
.task{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 2px;border-radius:6px}
.task:hover{background:rgba(255,255,255,.04)}.task input{accent-color:var(--green);width:16px;height:16px;cursor:pointer}
.task span{flex:1}.task.done span{text-decoration:line-through;color:var(--muted)}
.task .x{opacity:0;cursor:pointer;color:var(--muted);font-size:12px;padding:0 4px}.task:hover .x{opacity:1}
.addrow{display:flex;gap:6px;margin-top:8px}.addrow input,.addrow select{padding:6px 9px;font-size:12px}
.actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.agents{margin-top:8px;display:flex;flex-direction:column;gap:5px}
.agent{display:flex;align-items:center;gap:8px;font-size:12px;background:rgba(0,0,0,.18);border-radius:10px;padding:6px 8px;cursor:pointer;border:1px solid transparent}
.agent:hover{border-color:var(--line)}
.agent .an{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:10px;font-weight:800;border-radius:999px;padding:2px 7px;white-space:nowrap}
.pill.working{background:rgba(126,232,162,.15);color:var(--green)}.pill.question{background:rgba(255,209,102,.18);color:var(--accent)}
.pill.finding{background:rgba(200,182,255,.18);color:var(--purple)}.pill.stale{background:rgba(154,163,209,.15);color:var(--muted)}
.pill.done{background:rgba(142,202,230,.15);color:var(--blue)}.pill.idle{background:rgba(154,163,209,.15);color:var(--muted)}
.need{display:flex;align-items:center;gap:8px;font-size:12px;padding:7px 9px;border-radius:10px;cursor:pointer;background:rgba(255,209,102,.07);border:1px solid rgba(255,209,102,.25)}
.need:hover{background:rgba(255,209,102,.14)}.need b{color:var(--text)}.need small{color:var(--muted)}
.perf{margin-top:8px;font-size:12px;background:linear-gradient(135deg,rgba(255,209,102,.16),rgba(200,182,255,.12));border:1px solid rgba(255,209,102,.35);border-radius:10px;padding:8px 10px}
.perf p{margin:4px 0}
#foot{padding:8px 12px;border-top:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--muted);align-items:center}
#foot .sp{flex:1}
#stage{position:relative;min-width:0;overflow:hidden}
canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}canvas.drag{cursor:grabbing}
#hud{position:absolute;top:12px;right:14px;display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
#hud b{color:var(--text)}
#zoomctl{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:6px}
#zoomctl button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:rgba(19,26,59,.9);color:var(--text);font-size:16px;cursor:pointer}
#hint{position:absolute;left:14px;bottom:14px;font-size:11px;color:var(--muted);background:rgba(19,26,59,.7);padding:6px 10px;border-radius:10px}
#toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:rgba(19,26,59,.92);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.show{opacity:1}
#pop{position:absolute;width:260px;background:rgba(14,18,44,.96);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:none;box-shadow:0 12px 40px rgba(0,0,0,.45);font-size:12px;z-index:5}
#pop .ph{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px}
#pop .ph .cl{margin-left:auto;cursor:pointer;color:var(--muted)}
#pop .st{margin:6px 0;color:var(--muted)}
#pop .note{background:rgba(255,255,255,.05);border-radius:8px;padding:7px 8px;margin:6px 0;white-space:pre-wrap;max-height:120px;overflow:auto}
#pop .chat{max-height:170px;overflow:auto;margin:6px 0;display:flex;flex-direction:column;gap:3px}
.msg{padding:5px 8px;border-radius:10px;font-size:12px;white-space:pre-wrap;max-width:88%}
.msg.you{background:rgba(255,209,102,.16);align-self:flex-end;border-bottom-right-radius:3px}
.msg.bot{background:rgba(255,255,255,.07);align-self:flex-start;border-bottom-left-radius:3px}
.msg small{display:block;color:var(--muted);font-size:10px;margin-top:2px}
#pop form.say{display:flex;gap:6px;margin-top:6px}#pop form.say input{padding:6px 9px;font-size:12px}
#pop .pa{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
#pop .accent{background:#ff7a45;color:#fff;border:0;border-radius:8px;padding:6px 10px;font-weight:800;cursor:pointer;font:inherit;font-size:12px}
#empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--muted);font-size:14px;pointer-events:none;text-align:center}
@media (max-width:760px){#app{grid-template-columns:1fr;grid-template-rows:1fr 46vh}#side{order:2;border-right:0;border-top:1px solid var(--line)}#hint{display:none}#side header .sub{display:none}#hud{font-size:11px}button.ghost{padding:7px 10px;font-size:12px}#zoomctl button{width:40px;height:40px}}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <header>
      <h1>🪐 Tiny Planet <span>Crew</span></h1>
      <div class="sub">One tile per project. Every chat, scheduled task, or research bot is a robot working there.</div>
    </header>
    <form id="addForm"><input type="text" id="newProject" placeholder="New project… e.g. Product reels" maxlength="40" autocomplete="off"><button class="primary" type="submit">+ Tile</button></form>
    <div id="scroll"></div>
    <div id="foot">
      <button class="ghost" id="exportBtn">Export</button><button class="ghost" id="importBtn">Import</button><input type="file" id="importFile" accept="application/json" hidden>
      <button class="ghost" id="soundBtn">🔔</button>
      <select id="staleSel" title="Consider a robot lonely after…"><option value="6">stale 6h</option><option value="24" selected>stale 24h</option><option value="72">stale 3d</option><option value="168">stale 7d</option></select>
      <span class="sp"></span><span id="bridge">local</span>
    </div>
  </aside>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="hud"><span>Tiles <b id="hudTiles">0</b></span>·<span>Robots <b id="hudBots">0</b></span>·<span>Need you <b id="hudNeed">0</b></span></div>
    <div id="zoomctl"><button id="zin">+</button><button id="zout">−</button><button id="zfit" title="Fit all">⌂</button></div>
    <div id="hint">drag to pan · scroll to zoom · click a robot · double-click a tile</div>
    <div id="empty">Add a project on the left and a tile will appear 🤖</div>
    <div id="pop"></div>
    <div id="toast"></div>
  </div>
</div>
<script>
(() => {
const KEY='tinyPlanetCrew.v2';
const COLORS=['#ff8fab','#ffd166','#7ee8a2','#8ecae6','#c8b6ff','#ffb703','#90dbf4','#f4a261','#a0e7e5','#ffabab'];
const LV=[0,1,3,5,8,11,15,19,24,30]; // cumulative tasks done for level 1..10
const MAXLV=10;
const S=120, K=0.62;            // hex circumradius (world units), iso squash
const INR=S*0.8660254;
const KINDS={chat:'💬 Chat',scheduled:'⏰ Scheduled',research:'🔭 Research'};
const STATUS={working:'working',question:'has a question',finding:'found something',stale:'lonely',done:'finished',idle:'waiting on you'};

// ---------- state ----------
let state=load();
function load(){ try{const s=JSON.parse(localStorage.getItem(KEY)); if(s&&s.projects) return s;}catch(e){} return seed(); }
function seed(){
  const st={sound:true,staleHours:24,projects:[]};
  const a=mk(st,'New stamp release',['Finalize artwork','Cut plates','Photograph set','Write listing']); a.tasks[0].done=a.tasks[1].done=true;
  a.agents.push(ag('Plate cutter','chat','working','Cutting the second sheet now.'));
  const lw=ag('Listing writer','chat','question','Should the listing mention the coordinating dies, or keep it stamp-only?'); lw.log=[{who:'you',text:'Write the listing for the new release',ts:Date.now()-3600e3},{who:'bot',text:'Drafted the listing. Should it mention the coordinating dies, or keep it stamp-only?',ts:Date.now()-1800e3}]; a.agents.push(lw);
  const b=mk(st,'Product reels',['Film 3 reels','Edit reel 1','Upload to YouTube']);
  b.agents.push(ag('Reel editor','chat','working','Recutting reel 1.'));
  b.agents.push(ag('Nightly uploader','scheduled','stale','Runs at 2am. Last run uploaded 1 reel.',Date.now()-36*3600e3));
  const c=mk(st,'Website refresh',['Pick hero image','Update nav']);
  c.agents.push(ag('Nav helper','chat','finding','While fixing nav I noticed the footer links go to 3 dead pages. Want me to fix those too?'));
  return st;
}
function mk(st,name,tasks=[]){ const p={id:uid(),name,color:COLORS[st.projects.length%COLORS.length],tasks:tasks.map(t=>({id:uid(),text:t,done:false})),agents:[],hex:nextHex(st),created:Date.now(),perfectedAt:null,seed:Math.floor(Math.random()*1e6)}; st.projects.push(p); return p; }
function ag(name,kind='chat',status='working',note='',lastSeen=Date.now()){ return {id:uid(),name,kind,status,note,lastSeen,created:Date.now(),live:false}; }
function uid(){ return Math.random().toString(36).slice(2,9); }
function save(){ localStorage.setItem(KEY,JSON.stringify(state)); }
function doneCount(p){ return p.tasks.filter(t=>t.done).length; }
function levelFor(done){ let l=1; for(let i=1;i<LV.length;i++) if(done>=LV[i]) l=i+1; return l; }
function nextAt(done){ for(let i=1;i<LV.length;i++) if(done<LV[i]) return LV[i]; return null; }
function level(p){ return levelFor(doneCount(p)); }
function isPerfect(p){ return level(p)>=MAXLV; }
function effStatus(a){ if(a.status==='working'||a.status==='idle'){ const h=(Date.now()-(a.lastSeen||0))/3600e3; if(h>(state.staleHours||24)) return 'stale'; } return a.status; }
function needsYou(a){ const s=effStatus(a); return s==='question'||s==='finding'||s==='stale'||s==='idle'; }

// hex spiral slots
function spiral(n){ if(n===0) return [0,0]; let r=1,i=1; while(true){ const ring=6*r; if(n<i+ring){ const k=n-i; const side=Math.floor(k/r), step=k%r; const dirs=[[0,-1],[-1,0],[-1,1],[0,1],[1,0],[1,-1]]; let q=r, rr=0; /* start at (r,0) then walk */ let cq=r,cr=0; for(let s=0;s<side;s++){ cq+=dirs[s][0]*r; cr+=dirs[s][1]*r; } cq+=dirs[side][0]*step; cr+=dirs[side][1]*step; return [cq,cr]; } i+=ring; r++; } }
function nextHex(st){ const used=new Set(st.projects.map(p=>p.hex.join(','))); for(let n=0;n<500;n++){ const h=spiral(n); if(!used.has(h.join(','))) return h; } return [0,0]; }
function hexCenter(h){ return {x:S*1.5*h[0], y:S*1.7320508*(h[1]+h[0]/2)}; }

// ---------- sound ----------
let actx=null;
function beep(seq){ if(!state.sound) return; try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); let t=actx.currentTime; seq.forEach(([f,d])=>{const o=actx.createOscillator(),g=actx.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.14,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d);t+=d*0.8;}); }catch(e){} }
const SFX={tick:[[880,.08]],levelup:[[523,.12],[659,.12],[784,.12],[1047,.25]],perfect:[[659,.1],[784,.1],[988,.1],[1319,.12],[1568,.4]],ask:[[660,.1],[880,.15]],bot:[[440,.06],[660,.08]]};

// ---------- sidebar ----------
const scroll=document.getElementById('scroll');
let selected=null, selAgent=null;
function ago(ts){ if(!ts) return 'never'; const m=(Date.now()-ts)/60000; if(m<1) return 'just now'; if(m<60) return Math.round(m)+'m ago'; const h=m/60; if(h<48) return Math.round(h)+'h ago'; return Math.round(h/24)+'d ago'; }
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function render(){
  scroll.innerHTML='';
  // needs-you list
  const needs=[]; state.projects.forEach(p=>p.agents.forEach(a=>{ if(needsYou(a)) needs.push({p,a,s:effStatus(a)}); }));
  needs.sort((x,y)=>({question:0,finding:1,idle:2,stale:3}[x.s]-{question:0,finding:1,idle:2,stale:3}[y.s]));
  if(needs.length){ const h=document.createElement('h3'); h.textContent='Needs you'; scroll.appendChild(h);
    needs.forEach(({p,a,s})=>{ const d=document.createElement('div'); d.className='need'; d.innerHTML=`<span>${{question:'❓',finding:'💡',idle:'🙋',stale:'💤'}[s]}</span><span style="flex:1;min-width:0"><b>${esc(a.name)}</b> <small>· ${esc(p.name)}</small><br><small>${esc(a.note||STATUS[s])}</small></span>`; d.onclick=()=>{ focusAgent(p,a); }; scroll.appendChild(d); });
  }
  const h2=document.createElement('h3'); h2.textContent='Tiles'; scroll.appendChild(h2);
  state.projects.forEach(p=>{
    const done=doneCount(p), lvl=level(p), nx=nextAt(done), pct=nx?Math.round((done-LV[lvl-1])/(nx-LV[lvl-1])*100):100;
    const card=document.createElement('div'); card.className='card'+(selected===p.id?' sel':''); card.dataset.id=p.id;
    const open=selected===p.id;
    card.innerHTML=`<div class="top"><span class="dot" style="background:${p.color}"></span><span class="name">${esc(p.name)}</span><span class="lvl ${lvl>=MAXLV?'max':''}">${lvl>=MAXLV?'★ Perfected':'Lv '+lvl}</span></div>
      <div class="bar"><i style="width:${pct}%;background:${p.color}"></i></div>
      <div class="meta"><span>${done} done · ${p.agents.length} robot${p.agents.length===1?'':'s'}</span><span>${nx!==null?`${nx-done} task${nx-done===1?'':'s'} to Lv ${lvl+1}`:'keep polishing ✨'}</span></div>`;
    if(open){
      const body=document.createElement('div');
      body.innerHTML=`
        ${isPerfect(p)?`<div class="perf"><b>★ Perfected.</b><p>Nothing's ever truly done, so a Scout lives here now and keeps researching ways to improve it. When it finds something it'll raise a 💡.</p><div class="actions"><button class="ghost" data-act="prompt">📋 Copy research prompt</button></div></div>`:''}
        <div class="agents">${p.agents.map(a=>{const s=effStatus(a);return `<div class="agent" data-a="${a.id}"><span>${{chat:'💬',scheduled:'⏰',research:'🔭'}[a.kind]||'🤖'}</span><span class="an">${esc(a.name)}${a.live?' <small style="color:var(--green)">●</small>':''}</span><span class="pill ${s}">${STATUS[s]}</span></div>`;}).join('')}</div>
        <form class="addrow" data-f="agent"><input type="text" placeholder="Robot joins: name of chat / task" maxlength="30" autocomplete="off"><select><option value="chat">💬</option><option value="scheduled">⏰</option><option value="research">🔭</option></select><button class="primary" type="submit">+</button></form>
        <div class="tasks">${p.tasks.map(t=>`<label class="task ${t.done?'done':''}"><input type="checkbox" data-t="${t.id}" ${t.done?'checked':''}><span>${esc(t.text)}</span><b class="x" data-del="${t.id}">✕</b></label>`).join('')}</div>
        <form class="addrow" data-f="task"><input type="text" placeholder="Add a task…" maxlength="80" autocomplete="off"><button class="primary" type="submit">+</button></form>
        <div class="actions"><button class="ghost" data-act="color">🎨</button><button class="ghost" data-act="rename">✏️ Rename</button><button class="ghost" data-act="zoom">🔍 Go to tile</button><button class="ghost warn" data-act="del">🗑</button></div>`;
      card.appendChild(body);
      body.querySelectorAll('.agent').forEach(el=>el.onclick=()=>focusAgent(p,p.agents.find(a=>a.id===el.dataset.a)));
      body.querySelector('[data-f=agent]').onsubmit=e=>{e.preventDefault(); const inp=e.target.querySelector('input'), kind=e.target.querySelector('select').value; const v=inp.value.trim(); if(!v) return; const a=ag(v,kind,'working',''); p.agents.push(a); spawnAt(p,a); beep(SFX.bot); toast(`${v} joined ${p.name}`); commit(); };
      body.querySelector('[data-f=task]').onsubmit=e=>{e.preventDefault(); const inp=e.target.querySelector('input'); const v=inp.value.trim(); if(!v) return; p.tasks.push({id:uid(),text:v,done:false}); commit(); };
      body.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.onchange=()=>toggleTask(p,cb.dataset.t,cb.checked));
      body.querySelectorAll('.x').forEach(x=>x.onclick=e=>{e.preventDefault(); p.tasks=p.tasks.filter(t=>t.id!==x.dataset.del); commit();});
      body.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>action(p,b.dataset.act));
    }
    card.querySelector('.top').onclick=()=>{ selected = selected===p.id?null:p.id; render(); if(selected) flyTo(p); };
    scroll.appendChild(card);
  });
  const bots=state.projects.reduce((a,p)=>a+p.agents.length,0);
  document.getElementById('hudTiles').textContent=state.projects.length; document.getElementById('hudBots').textContent=bots; document.getElementById('hudNeed').textContent=needs.length;
  document.getElementById('empty').style.display=state.projects.length?'none':'flex';
  document.getElementById('soundBtn').textContent=state.sound?'🔔':'🔕';
  document.getElementById('staleSel').value=String(state.staleHours||24);
}
function commit(){ save(); render(); }
function toggleTask(p,tid,val){
  const before=level(p); const t=p.tasks.find(t=>t.id===tid); if(!t) return; t.done=val; const after=level(p);
  if(val) beep(SFX.tick);
  if(after>before){ burst(p,'LEVEL '+after+'!'); beep(after>=MAXLV?SFX.perfect:SFX.levelup); toast(`${p.name} → level ${after}`);
    if(after>=MAXLV && !p.perfectedAt){ p.perfectedAt=Date.now(); const sc=ag('Scout','research','working','Researching ways to make this even better.'); p.agents.push(sc); spawnAt(p,sc); setTimeout(()=>toast(`★ ${p.name} is perfected. A Scout moved in to keep looking for improvements.`),1500); } }
  commit();
}
function action(p,act){
  if(act==='color') p.color=COLORS[(COLORS.indexOf(p.color)+1)%COLORS.length];
  if(act==='rename'){ const n=prompt('Rename tile',p.name); if(n&&n.trim()) p.name=n.trim().slice(0,40); }
  if(act==='zoom'){ flyTo(p,1.4); }
  if(act==='prompt'){ copy(researchPrompt(p)); toast('Research prompt copied. Paste it into a Claude Code chat for this project.'); }
  if(act==='del'){ if(!confirm(`Remove the "${p.name}" tile and its robots?`)) return; state.projects=state.projects.filter(x=>x.id!==p.id); if(selected===p.id) selected=null; }
  commit();
}

const bots=new Map(); // agent id -> {id,pid,x,y,tx,ty,face,seed}
function rnd(seed){ let s=seed>>>0||1; return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }
function spawnAt(p,a){ const c=hexCenter(p.hex); const r=rnd(a.id.split('').reduce((x,ch)=>x*31+ch.charCodeAt(0),7)); const pt=wanderPt(p,r); bots.set(a.id,{id:a.id,pid:p.id,x:c.x,y:c.y+INR*0.5,tx:pt.x,ty:pt.y,face:1,seed:r()*1000,r,pause:0}); }

let last=performance.now();
function frame(now){ const dt=Math.min(0.05,(now-last)/1000); last=now; const t=now/1000;
  if(camTarget){ cam.x+=(camTarget.x-cam.x)*0.1; cam.y+=(camTarget.y-cam.y)*0.1; cam.z+=(camTarget.z-cam.z)*0.1; if(Math.abs(camTarget.x-cam.x)<0.5&&Math.abs(camTarget.z-cam.z)<0.003){ const cb=camTarget.cb; cam.x=camTarget.x; cam.y=camTarget.y; cam.z=camTarget.z; camTarget=null; if(cb) cb(); } }
  syncBots(); stepBots(dt); drawWorld(t);
  requestAnimationFrame(frame);
}
setInterval(()=>{ render(); },60000); // refresh "ago" + stale states

// ---------- bridge (optional live sync from Claude Code hooks) ----------
const bridgeEl=document.getElementById('bridge');
async function pollBridge(){
  if(!/^https?:/.test(location.protocol)) { bridgeEl.textContent='saved locally'; return; }
  try{ const r=await fetch('state.json?ts='+Date.now(),{cache:'no-store'}); if(!r.ok) throw 0; const live=await r.json(); mergeBridge(live); bridgeEl.textContent='🟢 live bridge'; }
  catch(e){ bridgeEl.textContent='saved locally'; }
  setTimeout(pollBridge,4000);
}
function mergeBridge(live){
  let changed=false;
  (live.projects||[]).forEach(lp=>{
    const norm=v=>String(v).toLowerCase().replace(/[^a-z0-9]/g,''); let p=state.projects.find(x=>norm(x.name)===norm(lp.name)); if(!p){ p=mk(state,lp.name); changed=true; }
    (lp.agents||[]).forEach(la=>{
      let a=p.agents.find(x=>x.sessionId===la.sessionId); if(!a){ a=ag(la.name||'Claude chat',la.kind||'chat',la.status||'working',la.note||'',la.lastSeen||Date.now()); a.sessionId=la.sessionId; a.live=true; if(la.log) a.log=la.log; p.agents.push(a); changed=true; toast(`🤖 ${a.name} joined ${p.name}`); beep(SFX.bot); }
      else { const ll=JSON.stringify(la.log||[]); if(a.status!==la.status||a.note!==la.note||a.lastSeen!==la.lastSeen||(la.log&&ll!==JSON.stringify(a.log||[]))){ a.status=la.status||a.status; a.note=la.note??a.note; a.lastSeen=la.lastSeen||a.lastSeen; if(la.log) a.log=la.log; a.live=true; changed=true; } }
    });
  });
  if(changed) commit();
}

save(); render(); fitAll(); requestAnimationFrame(frame); pollBridge();
})();
</script>
